name: Workbench healthcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check app.js
          node --check server.mjs
          node --check healthcheck.mjs
          bash -n start-workbench.sh
      - name: Start proxy
        run: node server.mjs > /tmp/touyantai-server.log 2>&1 &
      - name: Wait for proxy
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/touyantai-server.log
          exit 1
      - name: Probe public data routes
        run: node healthcheck.mjs
      - name: Build Nuxt vertical slice
        working-directory: apps/web
        env:
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
