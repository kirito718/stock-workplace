name: Workbench healthcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check app.js
          node --check server.mjs
          node --check healthcheck.mjs
          bash -n start-workbench.sh
      - name: Start proxy
        run: node server.mjs > /tmp/touyantai-server.log 2>&1 &
      - name: Wait for proxy
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/touyantai-server.log
          exit 1
      - name: Probe public data routes
        run: node healthcheck.mjs
      - name: Probe proxy hardening
        run: |
          PORT=4174 node server.mjs > /tmp/touyantai-hardening.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          head -c 262145 /dev/zero > /tmp/oversized-body
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST --data-binary @/tmp/oversized-body http://127.0.0.1:4174/api/cninfo/announcements)" = 413
          test -z "$(curl --silent --dump-header - -X OPTIONS http://127.0.0.1:4174/api/cninfo/stocks | grep -i '^access-control-allow-origin:' || true)"
          for i in {1..59}; do curl --silent --output /dev/null http://127.0.0.1:4174/api/cninfo/stocks; done
          test "$(curl --silent --dump-header - http://127.0.0.1:4174/api/cninfo/stocks | grep -i '^retry-after: 60' | tr -d '\r')" = 'Retry-After: 60'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4174/api/cninfo/stocks)" = 429
          CORS_ORIGIN=https://example.test PORT=4175 node server.mjs > /tmp/touyantai-cors.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --dump-header - -X OPTIONS http://127.0.0.1:4175/api/cninfo/stocks | grep -i '^access-control-allow-origin:' | tr -d '\r')" = 'Access-Control-Allow-Origin: https://example.test'
      - name: Build Nuxt vertical slice
        working-directory: apps/web
        env:
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
